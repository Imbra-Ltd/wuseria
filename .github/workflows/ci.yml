name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      lighthouse: ${{ steps.filter.outputs.lighthouse }}
      tools: ${{ steps.filter.outputs.tools }}
      staleness: ${{ steps.filter.outputs.staleness }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            code:
              - 'src/**'
              - 'public/**'
              - 'astro.config.mjs'
              - 'tsconfig.json'
              - 'package.json'
              - 'package-lock.json'
              - 'lighthouserc.json'
              - '.github/workflows/**'
            # Same paths as `code` minus the lockfile/manifest pair —
            # dependency-only PRs produce byte-identical site output
            # (see ADR-039), so re-measuring perf on them is single-run
            # noise. Build still runs to verify deps compile.
            lighthouse:
              - 'src/**'
              - 'public/**'
              - 'astro.config.mjs'
              - 'tsconfig.json'
              - 'lighthouserc.json'
              - '.github/workflows/**'
            # Python tooling — mtfdigitizer + brand extractors + pagefetch.
            # The emit_*_tier2 --check gates (#1296/#1300/#1303) only have
            # teeth when this job runs on PRs that could affect them.
            tools:
              - 'tools/**'
              - '.github/workflows/**'
            # `extract --check` re-renders every committed production log
            # and fails on drift (#1427, quality-gates-staleness). Its
            # inputs are the pipeline code, the source chart PNGs, and the
            # committed logs — so the filter must enumerate tools/** AND
            # docs/optical-specs/**; gating on tools/** alone would miss a
            # source-chart edit or a hand-edited log.
            staleness:
              - 'tools/**'
              - 'docs/optical-specs/**'
              - '.github/workflows/**'

  # Prettier checks ALL tracked files, so a format violation in any
  # Prettier-covered path (docs/**, root Markdown) must fail the PR — not
  # only the deploy. The `build` job below is path-filtered and skips
  # docs-only PRs, so this always-run job mirrors the deploy's format step
  # without an enumeration-fragile path filter. See ADR-076, #1362.
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run format

  # The vitest data-integrity suite reads the docs/optical-specs/**
  # filesystem (dirsWithLog, directory-name and same-product invariants),
  # which the `code` path-filter does NOT cover. The deploy runs these
  # tests unconditionally inside `validate`; the path-filtered `build` job
  # below skips them on a PR that only adds docs/optical-specs files, so
  # such a PR can go green while breaking the main deploy (#1441 -> #1442).
  # This always-run job mirrors the deploy's test step without an
  # enumeration-fragile path filter, exactly as `format` does for Prettier.
  # See ADR-086 (and ADR-076 for the format precedent).
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run test

  build:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run validate

  lighthouse:
    runs-on: ubuntu-latest
    needs: [build, changes]
    if: needs.changes.outputs.lighthouse == 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: lighthouserc.json
          uploadArtifacts: true

  pytest:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.tools == 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tools/requirements.txt

      - name: Install tools dependencies
        run: pip install -r tools/requirements.txt

      - name: Run pytest
        working-directory: tools
        run: python -m pytest -n auto

  # Real-tree production-log staleness gate. Runs the same command a
  # maintainer runs locally, so CI mirrors it exactly. Kept separate from
  # `pytest` (which unit-tests one tmp-dir slug) so it runs in parallel and
  # fires on docs/optical-specs/** changes too, not only tools/**. See
  # #1386 (the drift this prevents) and #1427.
  staleness:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.staleness == 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tools/requirements.txt

      - name: Install tools dependencies
        run: pip install -r tools/requirements.txt

      - name: Check production-log staleness
        working-directory: tools
        run: python -m mtfdigitizer.extract --check

  gate:
    runs-on: ubuntu-latest
    needs: [format, test, build, lighthouse, pytest, staleness]
    if: always()
    steps:
      - name: Check results
        run: |
          if [[ "${{ needs.format.result }}" == "failure" || "${{ needs.test.result }}" == "failure" || "${{ needs.build.result }}" == "failure" || "${{ needs.lighthouse.result }}" == "failure" || "${{ needs.pytest.result }}" == "failure" || "${{ needs.staleness.result }}" == "failure" ]]; then
            echo "CI failed"
            exit 1
          fi
