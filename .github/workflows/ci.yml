name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      lighthouse: ${{ steps.filter.outputs.lighthouse }}
      tools: ${{ steps.filter.outputs.tools }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            code:
              - 'src/**'
              - 'public/**'
              - 'astro.config.mjs'
              - 'tsconfig.json'
              - 'package.json'
              - 'package-lock.json'
              - 'lighthouserc.json'
              - '.github/workflows/**'
            # Same paths as `code` minus the lockfile/manifest pair —
            # dependency-only PRs produce byte-identical site output
            # (see ADR-039), so re-measuring perf on them is single-run
            # noise. Build still runs to verify deps compile.
            lighthouse:
              - 'src/**'
              - 'public/**'
              - 'astro.config.mjs'
              - 'tsconfig.json'
              - 'lighthouserc.json'
              - '.github/workflows/**'
            # Python tooling — mtfdigitizer + brand extractors + pagefetch.
            # The emit_*_tier2 --check gates (#1296/#1300/#1303) only have
            # teeth when this job runs on PRs that could affect them.
            tools:
              - 'tools/**'
              - '.github/workflows/**'

  # Prettier checks ALL tracked files, so a format violation in any
  # Prettier-covered path (docs/**, root Markdown) must fail the PR — not
  # only the deploy. The `build` job below is path-filtered and skips
  # docs-only PRs, so this always-run job mirrors the deploy's format step
  # without an enumeration-fragile path filter. See ADR-076, #1362.
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run format

  build:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run validate

  lighthouse:
    runs-on: ubuntu-latest
    needs: [build, changes]
    if: needs.changes.outputs.lighthouse == 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: lighthouserc.json
          uploadArtifacts: true

  pytest:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.tools == 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tools/requirements.txt

      - name: Install tools dependencies
        run: pip install -r tools/requirements.txt

      - name: Run pytest
        working-directory: tools
        run: python -m pytest -n auto

  gate:
    runs-on: ubuntu-latest
    needs: [format, build, lighthouse, pytest]
    if: always()
    steps:
      - name: Check results
        run: |
          if [[ "${{ needs.format.result }}" == "failure" || "${{ needs.build.result }}" == "failure" || "${{ needs.lighthouse.result }}" == "failure" || "${{ needs.pytest.result }}" == "failure" ]]; then
            echo "CI failed"
            exit 1
          fi
