name: Deploy to GitHub Pages

# Run on every push to main, or manually via the Actions tab
on:
  push:
    branches: [main]
  workflow_dispatch:

# Minimum permissions needed for GitHub Pages deployment
permissions:
  contents: read # read repo contents
  pages: write # publish to GitHub Pages
  id-token: write # verify the deployment originates from this repo

# Only one deployment at a time — don't cancel in-progress deploys
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Check out the repo, including the solid-ai-templates submodule
      - uses: actions/checkout@v7
        with:
          submodules: true

      # Set up Node.js with npm cache for faster installs
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      # Clean install from lock file, then run full quality gate (lint + format + check + test + build)
      - run: npm ci
      - run: npm run validate

      # Package dist/ as a GitHub Pages artifact for the deploy job
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/

  deploy:
    needs: build # wait for build to finish
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      # Report whichever attempt published the deployment (ADR-077)
      url: ${{ steps.deployment.outputs.page_url || steps.deployment-retry.outputs.page_url }}
    steps:
      # Deploy the uploaded artifact to GitHub Pages.
      # deploy-pages intermittently fails with a transient backend error
      # ("Deployment failed, try again later") even on a good build, so the
      # first attempt tolerates failure and a single retry follows (ADR-077).
      - id: deployment
        uses: actions/deploy-pages@v5
        continue-on-error: true

      # Back off before retrying to let the Pages backend recover
      - if: steps.deployment.outcome == 'failure'
        run: sleep 30

      # Single retry — a manual re-run reliably succeeds, so one suffices.
      # Not continue-on-error: a double failure is a real backend problem
      # and MUST fail the job loud.
      - id: deployment-retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
