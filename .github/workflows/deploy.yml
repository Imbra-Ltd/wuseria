name: Deploy to GitHub Pages

# Run on every push to main, or manually via the Actions tab
on:
  push:
    branches: [main]
  workflow_dispatch:

# Minimum permissions needed for GitHub Pages deployment
permissions:
  contents: read # read repo contents
  pages: write # publish to GitHub Pages
  id-token: write # verify the deployment originates from this repo

# Only one deployment at a time — don't cancel in-progress deploys
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Check out the repo, including the solid-ai-templates submodule
      - uses: actions/checkout@v7
        with:
          submodules: true

      # Set up Node.js with npm cache for faster installs
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # Clean install from lock file, then run full quality gate (lint + format + check + test + build)
      - run: npm ci
      - run: npm run validate

      # Package dist/ as a GitHub Pages artifact for the deploy job
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/

  deploy:
    needs: build # wait for build to finish
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      # Report whichever attempt published the deployment (ADR-078)
      url: ${{ steps.deployment.outputs.page_url || steps.deployment-retry.outputs.page_url || steps.deployment-final.outputs.page_url }}
    steps:
      # Deploy the uploaded artifact to GitHub Pages.
      # deploy-pages intermittently fails with a transient backend error
      # ("Deployment failed, try again later") even on a good build. Three
      # bounded attempts with growing backoff (30s, then 90s) bridge the
      # multi-minute flakes a single 30s retry could not (ADR-078).
      - id: deployment
        uses: actions/deploy-pages@v5
        continue-on-error: true

      # First backoff — let the Pages backend recover
      - if: steps.deployment.outcome == 'failure'
        run: sleep 30

      - id: deployment-retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
        continue-on-error: true

      # Second, longer backoff — observed flakes recover within minutes
      - if: steps.deployment.outcome == 'failure' && steps.deployment-retry.outcome == 'failure'
        run: sleep 90

      # Final attempt — NOT continue-on-error: a triple failure spanning
      # ~2.5 minutes is a real backend outage and MUST fail the job loud.
      - id: deployment-final
        if: steps.deployment.outcome == 'failure' && steps.deployment-retry.outcome == 'failure'
        uses: actions/deploy-pages@v5
